[project]
name = "agent-tools-skills-lab"
version = "0.1.0"
description = "Shared environment for the five Agent Tools & Skills lab stages"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "stage-00-chat",
    "stage-01-files",
    "stage-02-skills",
    "stage-03-bash",
    "stage-04-script-skill",
    "stage-01-files-block1",
    "stage-02-skills-block1",
    "stage-03-bash-block2",
    "stage-04-script-skill-block2",
]
